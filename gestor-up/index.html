<head>

<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#101828;background:#f4f7fb;--ink:#101828;--muted:#667085;--line:#e4e7ec;--blue:#2563eb;--green:#16a34a;--amber:#d97706;--red:#dc2626;--card:#fff;--nav:#0f172a}
*{box-sizing:border-box}body{margin:0;background:#f4f7fb}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}.loginCard{width:100%;max-width:430px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 18px 55px rgba(16,24,40,.08)}
.logo{width:66px;height:66px;border-radius:20px;background:linear-gradient(135deg,#0f172a,#2563eb);display:grid;place-items:center;color:#fff;font-weight:900;font-size:20px;margin:0 auto 16px}.login h1{margin:0;text-align:center;font-size:30px}.login p{text-align:center;color:var(--muted);margin:8px 0 24px}
.field{width:100%;border:1px solid #cfd4dc;border-radius:12px;padding:12px 13px;background:#fff;outline:none}.field:focus{border-color:#94a3b8;box-shadow:0 0 0 3px rgba(37,99,235,.08)}.pin{font-size:24px;text-align:center;letter-spacing:8px}
.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:800}.btn.primary{background:#111827;color:#fff}.btn.blue{background:#2563eb;color:#fff}.btn.green{background:#16a34a;color:#fff}.btn.red{background:#dc2626;color:#fff}.btn.amber{background:#d97706;color:#fff}.btn.soft{background:#fff;color:#111827;border:1px solid #d0d5dd}.btn.full{width:100%}.btn:disabled{opacity:.5;cursor:not-allowed}
.login .btn{margin-top:14px}.err{min-height:20px;color:#b42318;text-align:center;font-size:13px;margin-top:10px}
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:var(--nav);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:21px;font-weight:900;padding:6px 10px 18px}.brand small{display:block;color:#94a3b8;font-size:11px;font-weight:600;margin-top:3px}
.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;border-radius:10px;padding:10px 12px;font-weight:800}.nav button.on{background:#1e293b;color:#fff}.nav button:hover{background:#172033}
.main{min-width:0}.top{min-height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 18px;position:sticky;top:0;z-index:5}.title{font-weight:900;font-size:21px}.live{font-size:12px;color:var(--muted)}.grow{flex:1}.topSearch{max-width:340px}
.content{padding:18px;max-width:1500px;margin:auto}.grid{display:grid;gap:12px}.metrics{grid-template-columns:repeat(5,minmax(0,1fr))}.metric,.card{background:#fff;border:1px solid var(--line);border-radius:16px}.metric{padding:15px}.metric small{color:var(--muted);font-weight:700}.metric b{display:block;font-size:28px;margin:3px 0}.metric span{font-size:12px;color:var(--muted)}
.sectionHead{display:flex;gap:10px;align-items:center;margin:22px 0 10px}.sectionHead h2{font-size:18px;margin:0;flex:1}.card{padding:15px;margin-bottom:10px}.row{display:flex;align-items:center;gap:8px}.wrap{flex-wrap:wrap}.pill{font-size:11px;color:#fff;font-weight:900;padding:5px 9px;border-radius:999px;white-space:nowrap}.muted{color:var(--muted);font-size:13px}.name{font-weight:900}.big{font-size:18px}.money{font-size:18px;font-weight:900}.sub{font-size:13px;color:#475467}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.four{grid-template-columns:repeat(4,1fr)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.empty{text-align:center;color:var(--muted);padding:30px}.alert{background:#fee4e2;color:#b42318;border-radius:10px;padding:10px;margin-top:10px;font-size:13px;font-weight:800}.notice{background:#eff8ff;color:#175cd3;border-radius:10px;padding:10px;margin-top:10px;font-size:13px;font-weight:800}.ok{color:#027a48}.warn{color:#b54708}.danger{color:#b42318}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters button{border:1px solid #d0d5dd;background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;color:#475467}.filters button.on{background:#111827;color:#fff;border-color:#111827}
.driverMeta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}.driverMeta div{background:#f8fafc;border-radius:10px;padding:9px;min-width:0}.driverMeta small{display:block;color:#667085;font-size:11px}.driverMeta b{font-size:13px;word-break:break-word}
.tableWrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:12px 14px;border-bottom:1px solid #eef2f6;text-align:left;font-size:13px}.table th{color:#667085;font-size:11px;text-transform:uppercase;letter-spacing:.04em}.amountPos{color:#027a48;font-weight:900}.amountNeg{color:#b42318;font-weight:900}
.modalBack{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;padding:16px;z-index:20}.modal{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 25px 70px rgba(0,0,0,.25)}.modal h3{margin:0 0 12px}.modal .field{margin-bottom:10px}.modalActions{display:flex;gap:8px;margin-top:12px;position:sticky;bottom:-20px;background:#fff;padding-top:10px;padding-bottom:2px}
.spinner{height:3px;background:#e2e8f0;overflow:hidden;display:none}.spinner:after{content:"";display:block;height:100%;width:35%;background:#2563eb;animation:run 1s linear infinite}@keyframes run{from{transform:translateX(-110%)}to{transform:translateX(310%)}}
.mobileNav{display:none}.mapBox{height:520px;border-radius:16px;border:1px solid var(--line);overflow:hidden;background:#e2e8f0}.statBar{height:8px;background:#eef2f6;border-radius:999px;overflow:hidden;margin-top:7px}.statBar span{display:block;height:100%;background:#2563eb}.kbd{font-size:11px;padding:2px 6px;border:1px solid #d0d5dd;border-radius:6px;background:#fff}
.statusDot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}.onlineDot{background:#16a34a}.offlineDot{background:#98a2b3}.staleDot{background:#d97706}
.infoSection{margin:0 0 17px}.infoSection h4{margin:0 0 8px}.infoGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}.infoBox{background:#f8fafc;border:1px solid #eef2f6;border-radius:12px;padding:11px}.infoBox small{display:block;color:#667085;font-weight:800;margin-bottom:4px}.infoBox div{font-weight:800;word-break:break-word}
.docGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.doc{border:1px solid var(--line);border-radius:14px;overflow:hidden}.doc img{display:block;width:100%;height:240px;object-fit:contain;background:#f8fafc}.docHead{padding:10px 12px;font-weight:900}.docFoot{padding:10px 12px}
@media(max-width:1100px){.metrics{grid-template-columns:repeat(3,1fr)}.four{grid-template-columns:1fr 1fr}}
@media(max-width:900px){.shell{display:block}.side{display:none}.content{padding:12px 12px 88px}.top{padding:9px 12px}.topSearch{display:none}.metrics{grid-template-columns:1fr 1fr}.driverMeta{grid-template-columns:1fr 1fr}.two,.three,.four{grid-template-columns:1fr}.mobileHide{display:none!important}.mobileNav{display:flex;overflow-x:auto;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:10;padding:5px 4px calc(5px + env(safe-area-inset-bottom));gap:2px}.mobileNav button{border:0;background:#fff;padding:8px 9px;font-size:10px;font-weight:800;color:#667085;white-space:nowrap;border-radius:9px}.mobileNav button.on{background:#111827;color:#fff}.mapBox{height:420px}}
</style>

<body>
<div id="login" class="login"><div class="loginCard"><div class="logo">UP</div><h1>UP Gestor</h1><p>Central operacional do UP Entregas</p><input id="pin" class="field pin" maxlength="6" inputmode="numeric" type="password" placeholder="••••••"><button class="btn primary full" onclick="login()">ENTRAR</button><div id="err" class="err"></div></div></div>
<div id="app" class="shell hidden">
<aside class="side"><div class="brand">UP Gestor<small>Central de logística</small></div><div id="nav" class="nav"></div></aside>
<section class="main">
<header class="top"><div><div id="pageTitle" class="title">Visão geral</div><div id="live" class="live">Conectando…</div></div><div class="grow"></div><input id="globalSearch" class="field topSearch" placeholder="Buscar pedido, cliente, entregador…" oninput="setSearch(this.value)"><button class="btn soft" onclick="refresh(true)">Atualizar</button><button class="btn soft mobileHide" onclick="logout()">Sair</button></header>
<div id="spin" class="spinner"></div><main id="content" class="content"></main>
</section>
<nav id="mobileNav" class="mobileNav"></nav>
</div>
<div id="modal" class="modalBack hidden"><div class="modal"><h3 id="modalTitle">Ação</h3><div id="modalBody"></div><div class="modalActions"><button class="btn soft grow" onclick="closeModal()">Fechar</button><button id="modalOk" class="btn primary grow">Confirmar</button></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const OPS='https://jgjmntezfjuyuxhcnvhd.supabase.co/functions/v1/gestor-orders';
const ADM='https://jgjmntezfjuyuxhcnvhd.supabase.co/functions/v1/up-manager-data';
const JWT='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impnam1udGV6Zmp1eXV4aGNudmhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1MzgyOTksImV4cCI6MjEwMzExNDI5OX0.n3yg9IdC6j8OB-vwi-yuXRKJZE3jdlL_wj3qVr-JBBc';
const tabs=[
 ['dashboard','Visão geral'],['map','Mapa'],['applications','Cadastros'],['couriers','Entregadores'],
 ['rides','Corridas'],['history','Histórico'],['occurrences','Ocorrências'],['finance','Financeiro'],
 ['payouts','Repasses'],['reports','Relatórios'],['audit','Auditoria'],['settings','Configurações']
];
let PIN=sessionStorage.getItem('upgestor_pin')||'',TAB='dashboard',ORD=[],COU=[],APP=[],FIN={couriers:[],payouts:[]},SET={},REPORT={},AUD=[],busy=false,appFilter='all',SEARCH='',timer=null,map=null;
const $=s=>document.querySelector(s);
const terminal=s=>['ENTREGUE','CONCLUIDO','CONCLUÍDO','FINALIZADO','RETIRADO','CANCELADO','CANCELADA'].includes(String(s||'').toUpperCase());
const finished=s=>['ENTREGUE','CONCLUIDO','CONCLUÍDO','FINALIZADO','RETIRADO'].includes(String(s||'').toUpperCase());
const activeDelivery=o=>['ENTREGA','DELIVERY',''].includes(String(o.fulfillment_type||'').toUpperCase())&&!terminal(o.status);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escAttr(s){return String(s??'').replace(/["'<>]/g,'')}
function brl(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function num(v){const n=Number(v||0);return isFinite(n)?n:0}
function valid(a,b){return a&&b&&Math.abs(a)<=90&&Math.abs(b)<=180}
function dateTime(x){try{return new Date(x).toLocaleString('pt-BR')}catch{return x||''}}
function relative(x){const d=(Date.now()-new Date(x).getTime())/1000;if(!isFinite(d)||d<0)return x;if(d<60)return'agora';if(d<3600)return`há ${Math.floor(d/60)} min`;if(d<86400)return`há ${Math.floor(d/3600)} h`;return`há ${Math.floor(d/86400)} d`}
function statusLabel(s){s=String(s||'').toUpperCase();if(s.includes('AGUARDANDO_ENTREGADOR')||s.includes('BUSCANDO_ENTREGADOR'))return'Buscando entregador';if(s.includes('PREPAR'))return'Em preparo';if(s==='PRONTO')return'Pronto';if(s.includes('DESPACH')||s.includes('ENTREGA'))return'Em entrega';if(terminal(s))return s.startsWith('CANCEL')?'Cancelado':'Finalizado';return s.replaceAll('_',' ')||'Sem status'}
function driverStatus(s){return({available:'Disponível',pickup:'Indo/na loja',delivery:'Em entrega',at_customer:'No cliente',offline:'Offline'})[String(s||'').toLowerCase()]||s||'Sem status'}
function qmatch(...v){if(!SEARCH)return true;const q=SEARCH.toLowerCase();return v.some(x=>String(x||'').toLowerCase().includes(q))}
async function ops(action,extra={}){const r=await fetch(OPS,{method:'POST',headers:{'content-type':'application/json','x-gestor-pin':PIN},body:JSON.stringify({action,...extra})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw Error(r.status===401?'PIN incorreto.':j.error||j.message||'Falha na operação');return j}
async function admin(action,extra={}){const r=await fetch(ADM,{method:'POST',headers:{'content-type':'application/json','x-gestor-pin':PIN,'apikey':JWT,'authorization':'Bearer '+JWT},body:JSON.stringify({action,...extra})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok){const e=Error(j.error||j.message||'Falha administrativa');e.data=j;throw e}return j}
async function login(){const p=$('#pin').value.trim();if(!/^\d{6}$/.test(p)){err('Digite o PIN de 6 dígitos.');return}PIN=p;try{await ops('ping');sessionStorage.setItem('upgestor_pin',PIN);start();await refresh(true)}catch(e){PIN='';err(e.message)}}
function start(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');renderNav();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{})}
function logout(){sessionStorage.removeItem('upgestor_pin');location.reload()}
function err(x){$('#err').textContent=x}
function renderNav(){const html=tabs.map(([id,label])=>`<button class="${TAB===id?'on':''}" onclick="go('${id}')">${label}</button>`).join('');$('#nav').innerHTML=html;$('#mobileNav').innerHTML=html}
function go(t){TAB=t;renderNav();$('#pageTitle').textContent=(tabs.find(x=>x[0]===t)||[])[1]||'UP Gestor';render();if(t==='audit')loadAudit();if(t==='reports')loadReport();if(t==='map')setTimeout(renderMap,30)}
function setSearch(v){SEARCH=String(v||'').trim();render();if(TAB==='map')setTimeout(renderMap,30)}
function setAutoRefresh(){clearInterval(timer);const sec=Math.max(5,num(SET.auto_refresh_seconds)||10);timer=setInterval(()=>refresh(false),sec*1000)}
async function refresh(show=false){if(busy||!PIN)return;busy=true;if(show)$('#spin').style.display='block';$('#live').textContent='Atualizando…';try{
 const [o,c,a,f,s]=await Promise.all([ops('list',{limit:120}),admin('couriers_full'),admin('applications_list'),admin('finance_summary'),admin('settings_get')]);
 ORD=o.orders||[];COU=c.couriers||[];APP=a.applications||[];FIN=f||{couriers:[],payouts:[]};SET=s.settings||{};setAutoRefresh();
 $('#live').textContent=`Ao vivo • ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;render();if(TAB==='map')setTimeout(renderMap,30)
}catch(e){$('#live').textContent='Falha de conexão';toast(e.message)}finally{busy=false;$('#spin').style.display='none'}}
function render(){const c=$('#content');const fn={dashboard:dashboardView,map:mapView,applications:applicationsView,couriers:couriersView,rides:ridesView,history:historyView,occurrences:occurrencesView,finance:financeView,payouts:payoutsView,reports:reportsView,audit:auditView,settings:settingsView}[TAB]||dashboardView;c.innerHTML=fn()}
function metric(a,b,c){return `<div class="metric"><small>${esc(a)}</small><b>${esc(b)}</b><span>${esc(c)}</span></div>`}
function empty(x){return `<div class="card empty">${esc(x)}</div>`}
function dashboardView(){
 const active=ORD.filter(activeDelivery),waiting=active.filter(o=>!o.courier_id),online=COU.filter(c=>c.online),pending=APP.filter(a=>a.status==='pending'||a.status==='correction'),occ=ORD.filter(o=>(o.raw_payload||{}).up_occurrence_active),balance=(FIN.couriers||[]).reduce((s,c)=>s+num(c.available_balance??c.balance),0);
 return `<div class="grid metrics">${metric('Corridas ativas',active.length,'em operação')}${metric('Sem entregador',waiting.length,'aguardando')}${metric('Entregadores online',online.length,'agora')}${metric('Cadastros pendentes',pending.length,'para analisar')}${metric('Ocorrências',occ.length,'abertas')}</div>
 <div class="grid two" style="margin-top:12px">${metric('Saldo disponível',brl(balance),'repasses disponíveis')}${metric('Atualização automática',`${Math.max(5,num(SET.auto_refresh_seconds)||10)}s`,'sem precisar atualizar')}</div>
 <div class="sectionHead"><h2>Atenção agora</h2></div>${[...occ.slice(0,3),...waiting.slice(0,3)].map(orderCard).join('')||empty('Operação sem alertas importantes.')}
 <div class="sectionHead"><h2>Entregadores online</h2><button class="btn soft" onclick="go('map')">Abrir mapa</button></div>${online.slice(0,6).map(courierCard).join('')||empty('Nenhum entregador online.')}`;
}
function mapView(){const list=COU.filter(c=>qmatch(c.name,c.phone,c.status));return `<div class="sectionHead"><h2>Mapa operacional</h2><span class="muted">${list.filter(c=>valid(num(c.current_lat),num(c.current_lng))).length} com GPS</span></div><div id="mapBox" class="mapBox"></div><div class="sectionHead"><h2>Localização dos entregadores</h2></div>${list.map(courierCard).join('')||empty('Nenhum entregador.')}`}
function renderMap(){
 const el=$('#mapBox');if(!el||!window.L)return;if(map){map.remove();map=null}
 map=L.map(el).setView([-20.4697,-54.6201],12);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
 const pts=[];
 COU.filter(c=>qmatch(c.name,c.phone,c.status)).forEach(c=>{const lat=num(c.current_lat),lng=num(c.current_lng);if(!valid(lat,lng))return;pts.push([lat,lng]);const m=L.marker([lat,lng]).addTo(map);m.bindPopup(`<b>${esc(c.name||'Entregador')}</b><br>${esc(driverStatus(c.status))}<br>${esc(c.last_location_at?relative(c.last_location_at):'')}`)});
 if(pts.length>1)map.fitBounds(pts,{padding:[30,30]});else if(pts.length===1)map.setView(pts[0],15);
}
function appStatusInfo(status){return({pending:['PENDENTE','#d97706'],approved:['APROVADO','#16a34a'],correction:['CORREÇÃO','#2563eb'],rejected:['REPROVADO','#dc2626'],blocked:['BLOQUEADO','#475467']})[status]||[String(status||'SEM STATUS').toUpperCase(),'#475467']}
function pick(o,...keys){o=o||{};for(const k of keys){const v=o[k];if(v!==undefined&&v!==null&&String(v).trim()!=='')return v}return ''}
function infoBox(label,value){return `<div class="infoBox"><small>${esc(label)}</small><div>${esc(value||'—')}</div></div>`}
function safeUrl(v){v=String(v||'').trim();return /^https?:\/\//i.test(v)?v:''}
function docCard(label,url){const u=safeUrl(url);if(!u)return infoBox(label,'Não enviado');return `<div class="doc"><div class="docHead">${esc(label)}</div><img src="${esc(u)}" alt="${esc(label)}" onerror="this.style.display='none'"><div class="docFoot"><a class="btn soft" href="${esc(u)}" target="_blank" rel="noopener" style="text-decoration:none">Abrir arquivo</a></div></div>`}
function applicationsView(){const counts={pending:0,approved:0,correction:0,rejected:0,blocked:0};APP.forEach(a=>counts[a.status]=(counts[a.status]||0)+1);const filters=[['all','Todos',APP.length],['pending','Pendentes',counts.pending],['correction','Correção',counts.correction],['approved','Aprovados',counts.approved],['rejected','Reprovados',counts.rejected],['blocked','Bloqueados',counts.blocked]];const rows=APP.filter(a=>(appFilter==='all'||a.status===appFilter)&&qmatch(a.full_name,a.email,a.phone,a.cpf));return `<div class="filters">${filters.map(([id,l,n])=>`<button class="${appFilter===id?'on':''}" onclick="appFilter='${id}';render()">${l} (${n})</button>`).join('')}</div>${rows.map(applicationCard).join('')||empty('Nenhum cadastro encontrado.')}`}
function applicationCard(a){const v=a.vehicle||{},s=appStatusInfo(a.status),veh=[pick(v,'tipo','type'),pick(v,'marca','brand'),pick(v,'modelo','model')].filter(Boolean).join(' ');return `<div class="card"><div class="row"><div class="grow"><div class="name big">${esc(a.full_name||'Entregador')}</div><div class="muted">${esc(a.email||'')}${a.phone?' • '+esc(a.phone):''}</div></div><span class="pill" style="background:${s[1]}">${s[0]}</span></div><div class="driverMeta"><div><small>CPF</small><b>${esc(a.cpf||'—')}</b></div><div><small>Veículo</small><b>${esc(veh||'—')}</b></div><div><small>Enviado</small><b>${esc(a.submitted_at?dateTime(a.submitted_at):'—')}</b></div><div><small>Análise</small><b>${esc(a.reviewed_at?dateTime(a.reviewed_at):'Pendente')}</b></div></div>${a.rejection_reason?`<div class="alert">${esc(a.rejection_reason)}</div>`:''}<div class="actions"><button class="btn primary" onclick="openApplicationReview('${a.id}')">Analisar cadastro completo</button></div></div>`}
function openApplicationReview(id){const a=APP.find(x=>x.id===id);if(!a)return;const ad=a.address||{},v=a.vehicle||{},p=a.pix||{},d=a.documents||{},m=a.metadata||{},s=appStatusInfo(a.status);const photo=pick(d,'photo_url','fotoUrl','photo','profile_url'),doc=pick(d,'document_url','documentoUrl','document','cnh_url');const body=`<div class="row" style="margin-bottom:16px"><div class="grow"><div class="name big">${esc(a.full_name||'Entregador')}</div><div class="muted">${esc(a.email||'')} ${a.phone?'• '+esc(a.phone):''}</div></div><span class="pill" style="background:${s[1]}">${s[0]}</span></div>
 <div class="infoSection"><h4>Identificação</h4><div class="infoGrid">${[infoBox('Nome completo',a.full_name),infoBox('CPF',a.cpf),infoBox('Nascimento',a.birth_date),infoBox('Telefone',a.phone),infoBox('E-mail',a.email),infoBox('UID Firebase',a.firebase_uid)].join('')}</div></div>
 <div class="infoSection"><h4>Endereço</h4><div class="infoGrid">${[infoBox('CEP',pick(ad,'cep','zip')),infoBox('Rua',pick(ad,'rua','street')),infoBox('Número',pick(ad,'numero','number')),infoBox('Bairro',pick(ad,'bairro','district')),infoBox('Cidade',pick(ad,'cidade','city'))].join('')}</div></div>
 <div class="infoSection"><h4>Veículo</h4><div class="infoGrid">${[infoBox('Tipo',pick(v,'tipo','type')),infoBox('Marca',pick(v,'marca','brand')),infoBox('Modelo',pick(v,'modelo','model')),infoBox('Cor',pick(v,'cor','color')),infoBox('Placa',pick(v,'placa','plate'))].join('')}</div></div>
 <div class="infoSection"><h4>Pix</h4><div class="infoGrid">${[infoBox('Tipo',pick(p,'tipo','type')),infoBox('Chave',pick(p,'chave','key')),infoBox('Titular',pick(p,'titular','holder'))].join('')}</div></div>
 <div class="infoSection"><h4>Documentos</h4><div class="docGrid">${docCard('Foto de perfil',photo)}${docCard('CNH / documento',doc)}</div></div>
 <div class="infoSection"><h4>Controle</h4><div class="infoGrid">${[infoBox('Status',s[0]),infoBox('Enviado',a.submitted_at?dateTime(a.submitted_at):''),infoBox('Atualizado',a.updated_at?dateTime(a.updated_at):''),infoBox('Analisado',a.reviewed_at?dateTime(a.reviewed_at):'Ainda não'),infoBox('Analisado por',a.reviewed_by),infoBox('Origem',pick(m,'source','origem')),infoBox('Versão app',pick(m,'app_version','appVersion'))].join('')}</div></div>
 ${a.notes?`<div class="notice"><b>Observações:</b> ${esc(a.notes)}</div>`:''}${a.rejection_reason?`<div class="alert"><b>Motivo:</b> ${esc(a.rejection_reason)}</div>`:''}
 <textarea id="appDecisionNote" class="field" rows="4" placeholder="Observação / motivo da decisão"></textarea>
 <div class="actions"><button class="btn green" onclick="reviewApp('${a.id}','approved')">Aprovar</button><button class="btn blue" onclick="reviewApp('${a.id}','correction')">Pedir correção</button><button class="btn red" onclick="reviewApp('${a.id}','rejected')">Reprovar</button><button class="btn soft" onclick="reviewApp('${a.id}','blocked')">Bloquear</button></div>`;
 openModal('Analisar cadastro',body,()=>closeModal(),'Fechar',920)
}
async function reviewApp(id,status){const field=$('#appDecisionNote'),note=field?field.value.trim():'';if(status!=='approved'&&!note){toast('Informe o motivo.');return}try{await admin('application_set',{id,status,reason:status==='approved'?'':note,notes:status==='approved'?note:null});closeModal();toast('Cadastro atualizado.');await refresh(false)}catch(e){toast(e.message)}}
function courierAdminState(c){const m=c.metadata||{};if(m.admin_blocked)return['BLOQUEADO','#475467'];if(m.suspended_until&&new Date(m.suspended_until).getTime()>Date.now())return['SUSPENSO','#d97706'];return[c.online?'ONLINE':'OFFLINE',c.online?'#16a34a':'#667085']}
function couriersView(){const rows=COU.filter(c=>qmatch(c.name,c.phone,c.status,(c.metadata||{}).vehicle_type));return rows.map(courierCard).join('')||empty('Nenhum entregador encontrado.')}
function courierCard(c){const f=(FIN.couriers||[]).find(x=>x.id===c.id)||{},m=c.metadata||{},st=courierAdminState(c),lat=num(c.current_lat),lng=num(c.current_lng),stale=c.last_location_at&&(Date.now()-new Date(c.last_location_at).getTime())>(num(SET.tracking_stale_minutes)||5)*60000;return `<div class="card"><div class="row"><div class="grow"><div class="name big"><span class="statusDot ${stale?'staleDot':c.online?'onlineDot':'offlineDot'}"></span>${esc(c.name||'Entregador')}</div><div class="muted">${esc(c.phone||'')} • ${esc(driverStatus(c.status))}</div></div><span class="pill" style="background:${st[1]}">${st[0]}</span></div><div class="driverMeta"><div><small>Último GPS</small><b>${esc(c.last_location_at?relative(c.last_location_at):'Sem GPS')}</b></div><div><small>Saldo disponível</small><b>${brl(f.available_balance??f.balance??0)}</b></div><div><small>Veículo</small><b>${esc((m.vehicle&&pick(m.vehicle,'tipo','type'))||m.vehicle_type||'—')}</b></div><div><small>Corrida atual</small><b>${esc(m.current_order_id?String(m.current_order_id).slice(0,8):'—')}</b></div></div>${m.suspension_reason?`<div class="notice">${esc(m.suspension_reason)}${m.suspended_until?' • até '+esc(dateTime(m.suspended_until)):''}</div>`:''}${m.block_reason?`<div class="alert">${esc(m.block_reason)}</div>`:''}<div class="actions">${valid(lat,lng)?`<button class="btn soft" onclick="openMap(${lat},${lng})">Abrir mapa</button>`:''}<button class="btn soft" onclick="openWallet('${c.id}')">Extrato</button><button class="btn blue" onclick="newPayout('${c.id}','${escAttr(c.name||'Entregador')}')">Repasse</button>${m.admin_blocked||m.suspended_until?`<button class="btn green" onclick="courierAdmin('${c.id}','active')">Reativar</button>`:`<button class="btn amber" onclick="courierSuspend('${c.id}','${escAttr(c.name||'Entregador')}')">Suspender</button><button class="btn red" onclick="courierBlock('${c.id}','${escAttr(c.name||'Entregador')}')">Bloquear</button>`}</div></div>`}
function courierSuspend(id,name){openModal('Suspender — '+name,`<input id="sUntil" class="field" type="datetime-local"><textarea id="sReason" class="field" rows="3" placeholder="Motivo obrigatório"></textarea>`,async()=>{const until=$('#sUntil').value,reason=$('#sReason').value.trim();if(!until||!reason){toast('Informe até quando e o motivo.');return}await courierAdmin(id,'suspended',reason,new Date(until).toISOString())},'Suspender')}
function courierBlock(id,name){openModal('Bloquear — '+name,`<textarea id="sReason" class="field" rows="4" placeholder="Motivo obrigatório"></textarea>`,async()=>{const reason=$('#sReason').value.trim();if(!reason){toast('Informe o motivo.');return}await courierAdmin(id,'blocked',reason)},'Bloquear')}
async function courierAdmin(id,mode,reason='',until=''){try{await admin('courier_admin_set',{courier_id:id,mode,reason,until});closeModal();toast('Entregador atualizado.');await refresh(false)}catch(e){toast(e.message)}}
function ridesView(){const list=ORD.filter(activeDelivery).filter(o=>qmatch(o.order_code,o.customer?.name,o.customer?.phone,o.courier?.name,o.status));return list.map(orderCard).join('')||empty('Nenhuma corrida ativa.')}
function historyView(){const list=ORD.filter(o=>terminal(o.status)).filter(o=>qmatch(o.order_code,o.customer?.name,o.customer?.phone,o.courier?.name,o.status));return list.map(orderCard).join('')||empty('Nenhuma corrida finalizada no período carregado.')}
function orderCard(o){const c=o.customer||{},d=o.courier||{},raw=o.raw_payload||{},code=o.order_code||String(o.id||'').slice(0,6).toUpperCase(),assigned=!!o.courier_id,lat=num(d.current_lat),lng=num(d.current_lng);return `<div class="card"><div class="row"><div class="grow"><div class="name big">#${esc(code)} • ${esc(c.name||'Cliente')}</div><div class="muted">${esc(statusLabel(o.status))}${o.payment_method?' • '+esc(o.payment_method):''} • ${esc(dateTime(o.created_at))}</div></div><div class="money">${brl(o.total)}</div></div><div class="sub" style="margin-top:8px">${assigned?'Entregador: '+esc(d.name||'Entregador'):'Sem entregador'}${o.delivery_address?' • '+esc(addressText(o.delivery_address)):''}</div>${raw.up_occurrence_active?`<div class="alert">OCORRÊNCIA • ${esc(raw.up_occurrence_reason||'Informada')}</div>`:''}<div class="actions">${!terminal(o.status)?`<button class="btn primary" onclick="assignOrder('${o.id}')">${assigned?'Trocar entregador':'Atribuir entregador'}</button>`:''}${assigned&&!terminal(o.status)?`<button class="btn soft" onclick="unassignOrder('${o.id}')">Remover entregador</button>`:''}${!assigned&&!terminal(o.status)?`<button class="btn blue" onclick="sendUp('${o.id}')">Enviar ao UP</button>`:''}${assigned&&valid(lat,lng)?`<button class="btn soft" onclick="openMap(${lat},${lng})">Mapa</button>`:''}</div></div>`}
function addressText(a){if(!a)return'';if(typeof a==='string')return a;return[pick(a,'rua','street'),pick(a,'numero','number'),pick(a,'bairro','district'),pick(a,'cidade','city')].filter(Boolean).join(', ')}
function assignOrder(orderId){const options=COU.filter(c=>!(c.metadata||{}).admin_blocked).map(c=>`<option value="${esc(c.id)}">${esc(c.name||'Entregador')} — ${c.online?'online':'offline'} — ${esc(driverStatus(c.status))}</option>`).join('');openModal('Atribuir entregador',`<select id="assignCourier" class="field"><option value="">Selecione…</option>${options}</select><div class="muted">A atribuição fica registrada na auditoria.</div>`,async()=>{const courier_id=$('#assignCourier').value;if(!courier_id){toast('Selecione o entregador.');return}try{await admin('order_assign',{order_id:orderId,courier_id});closeModal();toast('Corrida atribuída.');await refresh(false)}catch(e){toast(e.message)}},'Atribuir')}
async function unassignOrder(orderId){if(!confirm('Remover o entregador desta corrida?'))return;try{await admin('order_unassign',{order_id:orderId});toast('Entregador removido.');await refresh(false)}catch(e){toast(e.message)}}
async function sendUp(id){try{await ops('status',{orderId:id,status:'AGUARDANDO_ENTREGADOR'});toast('Pedido enviado ao UP.');await refresh(false)}catch(e){toast(e.message)}}
function occurrencesView(){const rows=ORD.filter(o=>(o.raw_payload||{}).up_occurrence_active).filter(o=>qmatch(o.order_code,o.customer?.name,o.courier?.name,(o.raw_payload||{}).up_occurrence_reason));return rows.map(o=>{const r=o.raw_payload||{},c=o.customer||{},d=o.courier||{};return `<div class="card"><div class="row"><div class="grow"><div class="name">#${esc(o.order_code||String(o.id).slice(0,6))} • ${esc(c.name||'Cliente')}</div><div class="muted">${esc(d.name||'Sem entregador')} • ${esc(r.up_occurrence_at?dateTime(r.up_occurrence_at):'')}</div></div><span class="pill" style="background:#dc2626">ABERTA</span></div><div class="alert">${esc(r.up_occurrence_reason||'Ocorrência informada')}</div><div class="actions"><button class="btn green" onclick="resolveOccurrence('${o.id}')">Resolver ocorrência</button></div></div>`}).join('')||empty('Nenhuma ocorrência aberta.')}
function resolveOccurrence(orderId){openModal('Resolver ocorrência',`<textarea id="solution" class="field" rows="4" placeholder="Descreva como foi resolvida"></textarea>`,async()=>{const solution=$('#solution').value.trim();if(!solution){toast('Informe a solução.');return}try{await admin('occurrence_resolve',{order_id:orderId,solution});closeModal();toast('Ocorrência resolvida.');await refresh(false)}catch(e){toast(e.message)}},'Resolver')}
function financeView(){const rows=(FIN.couriers||[]).filter(c=>qmatch(c.name,c.phone)),total=rows.reduce((s,c)=>s+num(c.available_balance??c.balance),0),pending=(FIN.payouts||[]).filter(p=>p.status==='pending').reduce((s,p)=>s+num(p.amount),0);return `<div class="grid three">${metric('Saldo disponível',brl(total),'descontando repasses pendentes')}${metric('Repasses pendentes',brl(pending),'aguardando pagamento')}${metric('Entregadores',rows.length,'no financeiro')}</div><div class="sectionHead"><h2>Carteiras</h2><button class="btn soft" onclick="syncFinance()">Sincronizar entregas</button></div>${rows.map(c=>`<div class="card"><div class="row"><div class="grow"><div class="name">${esc(c.name||'Entregador')}</div><div class="muted">${esc(c.phone||'')}</div></div><div><div class="money">${brl(c.available_balance??c.balance)}</div><div class="muted">Pendente: ${brl(c.pending_payout||0)}</div></div></div><div class="actions"><button class="btn soft" onclick="openWallet('${c.id}')">Extrato</button><button class="btn blue" onclick="newPayout('${c.id}','${escAttr(c.name||'Entregador')}')">Novo repasse</button><button class="btn soft" onclick="adjustWallet('${c.id}','${escAttr(c.name||'Entregador')}')">Ajuste</button></div></div>`).join('')||empty('Nenhum entregador no financeiro.')}`}
function payoutsView(){const rows=(FIN.payouts||[]).filter(p=>{const c=(FIN.couriers||[]).find(x=>x.id===p.courier_id)||{};return qmatch(c.name,c.phone,p.status,p.pix_key)});return `<div class="sectionHead"><h2>Repasses</h2><span class="muted">${rows.length} registros</span></div>${rows.map(payoutCard).join('')||empty('Nenhum repasse registrado.')}`}
function payoutCard(p){const c=(FIN.couriers||[]).find(x=>x.id===p.courier_id)||{};return `<div class="card"><div class="row"><div class="grow"><div class="name">${esc(c.name||'Entregador')}</div><div class="muted">${esc(p.method||'pix')}${p.pix_key?' • '+esc(p.pix_key):''} • ${esc(dateTime(p.requested_at))}</div></div><div class="money">${brl(p.amount)}</div><span class="pill" style="background:${p.status==='paid'?'#16a34a':p.status==='pending'?'#d97706':'#667085'}">${esc(p.status)}</span></div>${p.note?`<div class="sub" style="margin-top:8px">${esc(p.note)}</div>`:''}${p.status==='pending'?`<div class="actions"><button class="btn green" onclick="markPaid('${p.id}')">Marcar como pago</button></div>`:''}</div>`}
async function syncFinance(){try{const r=await admin('finance_sync');toast(`Financeiro sincronizado • ${r.created||0} novos.`);await refresh(false)}catch(e){toast(e.message)}}
async function markPaid(id){if(!confirm('Confirmar que este repasse foi pago?'))return;try{await admin('payout_mark_paid',{id});toast('Repasse marcado como pago.');await refresh(false)}catch(e){toast(e.message)}}
function newPayout(id,name){const f=(FIN.couriers||[]).find(x=>x.id===id)||{};openModal('Novo repasse — '+name,`<div class="notice">Disponível: ${brl(f.available_balance??f.balance??0)}</div><input id="mAmount" class="field" inputmode="decimal" placeholder="Valor, ex.: 25,00"><input id="mPix" class="field" placeholder="Chave Pix"><textarea id="mNote" class="field" rows="3" placeholder="Observação"></textarea>`,async()=>{const amount=Number($('#mAmount').value.replace(',','.'));if(!amount||amount<=0){toast('Informe um valor válido.');return}try{await admin('payout_create',{courier_id:id,amount,pix_key:$('#mPix').value,note:$('#mNote').value,method:'pix'});closeModal();toast('Repasse registrado.');await refresh(false)}catch(e){if(e.data?.available_balance!=null)toast('Saldo disponível: '+brl(e.data.available_balance));else toast(e.message)}},'Registrar')}
function adjustWallet(id,name){openModal('Ajuste — '+name,`<input id="mAmount" class="field" inputmode="decimal" placeholder="Valor positivo ou negativo"><textarea id="mNote" class="field" rows="3" placeholder="Motivo obrigatório"></textarea>`,async()=>{const amount=Number($('#mAmount').value.replace(',','.')),description=$('#mNote').value.trim();if(!amount||!description){toast('Informe valor e motivo.');return}try{await admin('wallet_adjust',{courier_id:id,amount,description});closeModal();toast('Ajuste registrado.');await refresh(false)}catch(e){toast(e.message)}},'Salvar')}
async function openWallet(id){try{const r=await admin('wallet_list',{courier_id:id}),tx=r.transactions||[];openModal('Extrato',`<div class="tableWrap"><table class="table"><thead><tr><th>Data</th><th>Descrição</th><th>Valor</th></tr></thead><tbody>${tx.map(t=>`<tr><td>${esc(dateTime(t.created_at))}</td><td>${esc(t.description||t.kind)}</td><td class="${num(t.amount)>=0?'amountPos':'amountNeg'}">${brl(t.amount)}</td></tr>`).join('')||'<tr><td colspan="3">Sem lançamentos</td></tr>'}</tbody></table></div>`,()=>closeModal(),'Fechar',820)}catch(e){toast(e.message)}}
async function loadReport(){try{const r=await admin('reports_summary',{days:30});REPORT=r.report||{};if(TAB==='reports')render()}catch(e){toast(e.message)}}
function reportsView(){const r=REPORT||{},rate=r.total_orders?Math.round((num(r.delivered)/num(r.total_orders))*100):0;const top=Object.entries(r.by_courier||{}).sort((a,b)=>b[1]-a[1]).slice(0,10);return `<div class="filters"><button onclick="reportDays(7)">7 dias</button><button onclick="reportDays(30)">30 dias</button><button onclick="reportDays(90)">90 dias</button></div><div class="grid metrics">${metric('Pedidos',r.total_orders||0,`${r.days||30} dias`)}${metric('Entregues',r.delivered||0,`${rate}% conclusão`)}${metric('Cancelados',r.cancelled||0,'no período')}${metric('Valor dos pedidos',brl(r.revenue||0),'entregues')}${metric('Tempo médio',`${Math.round(num(r.avg_completion_minutes))} min`,'criação → entrega')}</div><div class="sectionHead"><h2>Entregas por entregador</h2></div>${top.map(([id,n])=>{const c=COU.find(x=>x.id===id)||{};const max=top[0]?.[1]||1;return `<div class="card"><div class="row"><div class="grow"><div class="name">${esc(c.name||id.slice(0,8))}</div><div class="statBar"><span style="width:${Math.round(n/max*100)}%"></span></div></div><b>${n}</b></div></div>`}).join('')||empty('Sem dados suficientes.')}`}
async function reportDays(days){try{const r=await admin('reports_summary',{days});REPORT=r.report||{};render()}catch(e){toast(e.message)}}
async function loadAudit(){try{const r=await admin('audit_list',{limit:250});AUD=r.audit||[];if(TAB==='audit')render()}catch(e){toast(e.message)}}
function auditView(){const rows=AUD.filter(x=>qmatch(x.action,x.entity_type,x.entity_id,x.description,x.actor));return `<div class="sectionHead"><h2>Auditoria administrativa</h2><button class="btn soft" onclick="loadAudit()">Atualizar</button></div><div class="tableWrap"><table class="table"><thead><tr><th>Data</th><th>Ação</th><th>Entidade</th><th>Descrição</th><th>Responsável</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(dateTime(x.created_at))}</td><td>${esc(x.action)}</td><td>${esc(x.entity_type)} ${x.entity_id?'• '+esc(String(x.entity_id).slice(0,12)):''}</td><td>${esc(x.description||'')}</td><td>${esc(x.actor||'')}</td></tr>`).join('')||'<tr><td colspan="5">Sem registros</td></tr>'}</tbody></table></div>`}
function settingsView(){return `<div class="card"><div class="sectionHead" style="margin-top:0"><h2>Operação do UP</h2></div><div class="grid two">
 <label>Atualização automática (segundos)<input id="stRefresh" class="field" type="number" min="5" value="${esc(SET.auto_refresh_seconds??10)}"></label>
 <label>Raio de oferta (km)<input id="stRadius" class="field" type="number" min="1" step="0.5" value="${esc(SET.offer_radius_km??5)}"></label>
 <label>Tempo da oferta (segundos)<input id="stTimeout" class="field" type="number" min="10" value="${esc(SET.offer_timeout_seconds??30)}"></label>
 <label>Máx. corridas simultâneas<input id="stMax" class="field" type="number" min="1" max="10" value="${esc(SET.max_simultaneous_rides??3)}"></label>
 <label>Repasse padrão (R$)<input id="stFee" class="field" type="number" min="0" step="0.01" value="${esc(SET.default_courier_fee??0)}"></label>
 <label>GPS considerado parado após (min)<input id="stGps" class="field" type="number" min="1" value="${esc(SET.tracking_stale_minutes??5)}"></label>
 </div><div class="actions"><button class="btn primary" onclick="saveSettings()">Salvar configurações</button></div></div>
 <div class="card"><div class="name">Integrações</div><div class="driverMeta"><div><small>Supabase</small><b class="ok">Conectado</b></div><div><small>Gestor Orders</small><b class="ok">Ativo</b></div><div><small>Atualização</small><b>${Math.max(5,num(SET.auto_refresh_seconds)||10)}s</b></div><div><small>PWA</small><b>${'serviceWorker'in navigator?'Compatível':'Indisponível'}</b></div></div></div>`}
async function saveSettings(){const settings={auto_refresh_seconds:num($('#stRefresh').value),offer_radius_km:num($('#stRadius').value),offer_timeout_seconds:num($('#stTimeout').value),max_simultaneous_rides:num($('#stMax').value),default_courier_fee:num($('#stFee').value),tracking_stale_minutes:num($('#stGps').value),require_reason_on_block:true};try{const r=await admin('settings_set',{settings});SET=r.settings||settings;setAutoRefresh();toast('Configurações salvas.');render()}catch(e){toast(e.message)}}
function openModal(title,body,onOk,okLabel='Confirmar',maxWidth=520){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalOk').textContent=okLabel;$('#modalOk').onclick=onOk;$('#modal .modal').style.maxWidth=maxWidth+'px';$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden');$('#modalBody').innerHTML='';$('#modal .modal').style.maxWidth='520px'}
function toast(x){$('#live').textContent=x;setTimeout(()=>{if(PIN)$('#live').textContent='Ao vivo'},2800)}
function openMap(lat,lng){window.open(`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`,'_blank')}
if(PIN){start();refresh(true)}
</script>
</body>
</html>
